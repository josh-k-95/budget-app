[project]
name = "budget-app-backend"
version = "0.0.0"
description = "Backend API"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.120",
    "pwdlib[argon2]>=0.2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.10",
    "sqlalchemy>=2.0.40",
    "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.uv]
package = false
# Mirror the npm `min-release-age = 3` policy: ignore releases newer than 3 days when resolving.
exclude-newer = "3 days"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder would otherwise make the alembic package look first-party.
known-first-party = ["app", "tests"]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
